[project]
name = "ko-table-vlm"
version = "0.1.0"
description = "Korean complex table recognition (image -> HTML) with a LoRA-tuned small VLM"
readme = "README.md"
authors = [
    { name = "ttyon", email = "tjrdl6503@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apted>=1.0.3",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mlx-vlm>=0.7.11",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pypdfium2>=5.15.2",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
docling = [
    "docling>=2.150.1",
    "ocrmac>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
